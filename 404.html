<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10172a">
<title>404 · Weather+</title>
<style>
  /* 404 is served for ANY missing URL, so this page is fully self-contained (inline CSS/JS, no relative links). */
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;text-align:center;
    background:radial-gradient(1200px 700px at 50% -10%,#2b7fff55,transparent 60%),linear-gradient(180deg,#16233f,#10172a)}
  main{max-width:360px}
  svg{width:140px;height:auto;margin-bottom:8px;animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{font-size:76px;font-weight:200;letter-spacing:2px;line-height:1}
  h2{font-size:22px;font-weight:500;margin:10px 0 8px}
  p{opacity:.75;line-height:1.5;font-size:15px}
  a{display:inline-block;margin-top:26px;padding:13px 26px;border-radius:999px;color:#fff;text-decoration:none;font-weight:500;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  a:active{transform:scale(.97)}
  @media (prefers-reduced-motion:reduce){svg{animation:none}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 80" fill="none" aria-hidden="true">
    <path d="M32 62a16 16 0 0 1-2-31.9A24 24 0 0 1 76 26a18 18 0 0 1 12 36z" fill="rgba(255,255,255,.9)"/>
    <path d="M44 70l-4 8M62 70l-4 8M80 70l-4 8" stroke="#7fb4ff" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <h1>404</h1>
  <h2 id="t">Page not found</h2>
  <p id="d">The page you're looking for doesn't exist or has been moved.</p>
  <a id="h" href="/">Back to Weather+</a>
</main>
<script>
(function(){
  // If the site lives in a sub-folder, set it here (e.g. '/weather-plus/'). Leave null for auto-detect.
  var BASE=null;
  if(BASE===null){
    // GitHub Pages project sites live at user.github.io/<repo>/ ; everything else at the domain root.
    var seg=location.pathname.split('/').filter(Boolean)[0];
    BASE=(/\.github\.io$/.test(location.hostname)&&seg)?'/'+seg+'/':'/';
  }
  document.getElementById('h').href=BASE;
  var ic=document.createElement('link');ic.rel='icon';ic.href=BASE+'images/icon.svg';document.head.appendChild(ic);
  // Use the language the user picked in the app (falls back to the English text above).
  try{
    var code=localStorage.getItem('w_lang')||(navigator.language||'en').slice(0,2);
    if(code!=='en')fetch(BASE+'languages/'+encodeURIComponent(code)+'.json').then(function(r){return r.ok?r.json():null}).then(function(j){
      if(!j||!j.s)return;document.documentElement.lang=code;
      if(j.s['nf.title'])document.getElementById('t').textContent=j.s['nf.title'];
      if(j.s['nf.text'])document.getElementById('d').textContent=j.s['nf.text'];
      if(j.s['nf.home'])document.getElementById('h').textContent=j.s['nf.home'];
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
