const WMO={0:[1000,'Açık'],1:[1000,'Çoğunlukla açık'],2:[1003,'Parçalı bulutlu'],3:[1009,'Kapalı'],45:[1135,'Sisli'],48:[1147,'Kırağılı sis'],51:[1153,'Hafif çisenti'],53:[1153,'Çisenti'],55:[1153,'Yoğun çisenti'],56:[1168,'Donan çisenti'],57:[1168,'Donan çisenti'],61:[1183,'Hafif yağmur'],63:[1189,'Yağmur'],65:[1195,'Şiddetli yağmur'],66:[1198,'Donan yağmur'],67:[1198,'Donan yağmur'],71:[1213,'Hafif kar'],73:[1219,'Kar'],75:[1225,'Yoğun kar'],77:[1213,'Kar taneleri'],80:[1240,'Sağanak'],81:[1243,'Sağanak'],82:[1246,'Şiddetli sağanak'],85:[1255,'Kar sağanağı'],86:[1258,'Kar sağanağı'],95:[1087,'Gök gürültülü fırtına'],96:[1276,'Dolulu fırtına'],99:[1276,'Dolulu fırtına']};
const wcond = c => { const w = WMO[c] || [1009, 'Bilinmiyor']; return { code: w[0], text: w[1], icon: '' }; };
const DIRS = ['K','KKD','KD','DKD','D','DGD','GD','GGD','G','GGB','GB','BGB','B','BKB','KB','KKB'];

async function fetchWeather(q) {
  const [la, lo] = String(q).split(',').map(Number);
  if (!Number.isFinite(la) || !Number.isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) throw new Error('Geçersiz konum');
  const u =

    return `<div class="mc"><b>${lb}</b><span class="mv">${v==null?'—':c.f(v)}</span><div class="mb"><i style="height:${Math.min(Math.max(p,0),100)}%;background:${bg}"></i></div>${ar}</div>`}).join('');
}
function openX(k,quiet){
  const L=[...document.querySelectorAll('#tiles .t[data-m]')],i=L.findIndex(e=>e.dataset.m===k);if(i<0)return;
  L.forEach(e=>{e.classList.remove('x');e.style.display=''});
  const t=L[i];xm=k;if(L[i^1])L[i^1].style.display='none';
  t.style.transformOrigin=i%2?'right center':'left center';
  t.querySelector('.chart').innerHTML=buildChart(k);t.classList.add('x');
  t.style.animation=quiet?'none':'';if(!quiet)t.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function closeX(now){
  const t=document.querySelector('#tiles .t.x');xm=null;
  const fin=()=>{document.querySelectorAll('#tiles .t[data-m]').forEach(e=>{e.classList.remove('x');e.style.display='';e.style.animation='';if(!now&&!reduce)e.animate([{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.2,1,.3,1)'})})};
  if(!t||reduce||now){fin();return}

$('tiles').addEventListener('click',e=>{
  if(e.target.closest('.xc')){closeX();return}

});

/* ---------- 7 / 14 günlük liste ---------- */
let DD=null,exp=false,xt;
function drawDays(){
  if(!DD)return;const c=DD.current,f=DD.forecast.forecastday;
  $('dayT').textContent=exp?'14 günlük tahmin':'7 günlük tahmin';
  const fd=f.slice(0,exp?14:7);
  const temps=fd.flatMap(x=>[x.day.mintemp_c,x.day.maxtemp_c]).filter(Number.isFinite);
  const mn=Math.min(...temps),mx=Math.max(...temps),rg=(mx-mn)||1;
  $('days').innerHTML=fd.map((x,i)=>{
    const nm=i===0?'Bugün':new Date(x.date+'T12:00').toLocaleDateString('tr-TR',{weekday:'long'});
    const a=(x.day.mintemp_c-mn)/rg*100,b=Math.max((x.day.maxtemp_c-mn)/rg*100,a+10);
    const rp=x.day.rain??Math.max(0,...(x.hour||[]).map(h=>h.chance_of_rain||0));
    const sub=[exp&&new Date(x.date+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'}),rp>=20&&`%${rp} yağış`].filter(Boolean).join(' · ');
    const dot=i===0?`<u style="left:${Math.min(Math.max((c.temp_c-mn)/rg*100,0),100)}%"></u>`:'';
    return `<div class="d"><b>${nm}${sub?`<span class="rainp">${sub}</span>`:''}</b>${ic(kindOf(x.day.condition&&x.day.condition.code),1)}<span class="lo">${Math.round(x.day.mintemp_c)}°</span><div class="bar"><i style="left:${a}%;right:${100-b}%"></i>${dot}</div><span class="hi">${Math.round(x.day.maxtemp_c)}°</span></div>`}).join('');
}
function setExp(v){
  exp=v;$('more').classList.toggle('open',v);
  const el=$('days'),h0=el.offsetHeight,n0=el.children.length;drawDays();
  if(!reduce){
    const h1=el.offsetHeight;el.style.overflow='hidden';
    el.animate([{height:h0+'px'},{height:h1+'px'}],{duration:480,easing:'cubic-bezier(.2,1,.3,1)'}).onfinish=()=>{el.style.overflow=''};
    [...el.children].slice(n0).forEach((r,i)=>r.animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],{duration:420,delay:i*40,easing:'ease-out',fill:'backwards'}));
  }

function armX(){clearTimeout(xt);if(exp)xt=setTimeout(()=>setExp(false),60000)}
['pointerdown','touchmove','scroll'].forEach(e=>addEventListener(e,armX,{passive:true}));
$('more').onclick=()=>setExp(!exp);

function phaseG(p){
  const r=15,pw=p<.5?p:1-p,c=Math.cos(2*Math.PI*pw),rx=Math.abs(c)*r,sw=c>0?0:1;
  return `<circle cx="20" cy="20" r="15" fill="rgba(255,255,255,.2)"/><path d="M20 5A15 15 0 0 1 20 35A${rx.toFixed(2)} 15 0 0 ${sw} 20 5z" fill="#f3efd2" ${p>.5?'transform="translate(40 0) scale(-1 1)"':''}/>`;
}
const phaseIc=p=>`<svg viewBox="0 0 40 40" width="30" height="30">${phaseG(p)}</svg>`;
function skyTile(f,lt){
  const a=f[0].astro||{},mm=s=>{const m=/T(\d+):(\d+)/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
  const sr=mm(a.sunrise),ss=mm(a.sunset),n=/(\d+):(\d+)\s*$/.exec(lt||''),now=n?+n[1]*60+ +n[2]:null;
  if(sr!==null&&ss!==null&&now!==null&&now>=sr&&now<=ss)return sunTile(a,lt);
  return moonTile(f,lt)||sunTile(a,lt);
}
function moonTile(f,lt){
  const ev=[];f.slice(0,4).forEach(x=>{const a=x.astro||{};if(a.moonrise)ev.push([Date.parse(a.moonrise),1]);if(a.moonset)ev.push([Date.parse(a.moonset),0])});
  ev.sort((p,q)=>p[0]-q[0]);
  const now=Date.parse(String(lt).replace(' ','T'));if(!ev.length||isNaN(now))return '';
  let pi=-1;ev.forEach((e,i)=>{if(e[0]<=now)pi=i});
  const pv=ev[pi],nx=ev[pi+1],up=pv?pv[1]===1:!!(nx&&nx[1]===0);
  let rise=null,set=null;
  if(up){set=nx?nx[0]:null;rise=pv?pv[0]:(set?set-12*36e5:null)}
  else{rise=nx&&nx[1]===1?nx[0]:null;const s2=ev[pi+2];set=s2&&s2[1]===0?s2[0]:null}
  const fr=up&&rise&&set?Math.min(Math.max((now-rise)/(set-rise),0),1):null;
  const fm=ms=>{const x=Math.round(ms/6e4),h=Math.floor(x/60),m=x%60;return (h?h+' sa ':'')+m+' dk'};
  const tm=ms=>{if(!ms)return '—';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  const msg=up?(set?`Ay batışına ${fm(set-now)} kaldı`:'Ay gökyüzünde'):(rise?`Ay doğuşuna ${fm(rise-now)} kaldı`:'Ay görünmüyor');
  const p=num((f[0].astro||{}).moon_phase),P='M20 88A130 72 0 0 1 280 88';
  let nm='',il='';
  if(p!==null){nm=p<.03||p>.97?'Yeni ay':p<.22?'Büyüyen hilal':p<.28?'İlk dördün':p<.47?'Büyüyen ay':p<.53?'Dolunay':p<.72?'Küçülen ay':p<.78?'Son dördün':'Küçülen hilal';il=Math.round((1-Math.cos(2*Math.PI*p))/2*100)}
  const k=fr===null?0:fr,x=150-130*Math.cos(Math.PI*k),y=90-64*Math.sin(Math.PI*k);
  const mk=(cx,cy,o)=>p!==null?`<g opacity="${o}" transform="translate(${cx-20} ${cy-20})">${phaseG(p)}</g>`:`<circle cx="${cx}" cy="${cy}" r="10" fill="#f3efd2" opacity="${o}"/>`;
  const inner=`<path d="${PTH}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>`+
    (fr!==null?`<path d="${PTH}" pathLength="100" fill="none" stroke="#b9c6ff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${fr*100} 100"/><line x1="${x}" y1="${y}" x2="${x}" y2="90" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="${x}" cy="90" r="2.5" fill="rgba(255,255,255,.7)"/><circle class="pl2" cx="${x}" cy="${y}" r="34" fill="url(#gl)"/>${mk(x,y,1)}`:(!up&&rise?mk(20,90,.45):''));
  return `<div class="t wide glass press"><h4>Ay doğuşu ve batışı</h4>${scene([8,12,40],[38,48,110],'#cfd8ff',true,inner)}<div class="sun2"><div>${tm(rise)}<small>Doğuş</small></div><p>${p!==null?phaseIc(p)+`<br><b>${nm}</b> · %${il}<br>`:''}<small>${msg}${fr!==null?` · Yükseklik %${Math.round(Math.sin(Math.PI*fr)*100)}`:''}</small></p><div>${tm(set)}<small>Batış</small></div></div></div>`;
}
function render(d,stale){
  document.body.classList.remove('ld');
  if(!d||!d.current||!d.location||!d.forecast||!Array.isArray(d.forecast.forecastday)||!d.forecast.forecastday.length)throw new Error('Geçersiz hava verisi');
  const c=d.current,l=d.location,f=d.forecast.forecastday,cc=c.condition||{};
  const js=JSON.stringify(d)+(stale?1:0);
  $('upd').textContent='Güncelleme: '+hhmm(c.last_updated)+(stale?' (kayıtlı)':'');
  $('cityName').textContent=(loc&&loc.name)||(l.name+(l.country&&l.country!=='Turkey'?', '+l.country:''));
  if(js===lastJson)return;lastJson=js;
  const day=c.is_day===1;
  $('hIcon').innerHTML=ic(kindOf(cc.code),day);
  countTo($('temp'),Math.round(c.temp_c));
  $('cond').textContent=cc.text||'Bilinmiyor';
  $('hl').textContent=`En yüksek ${Math.round(f[0].day.maxtemp_c)}°  En düşük ${Math.round(f[0].day.mintemp_c)}°`;
  setTheme(themeOf(cc.code,day));

  // saatlik
  const nowK=key(l.localtime);
  const hrs=f.flatMap(x=>x.hour||[]).filter(h=>h&&key(h.time)>=nowK).slice(0,72);
  const nx=hrs.slice(0,12);let pk=null;nx.forEach((x,i)=>{if(!pk||x.chance_of_rain>pk.c)pk={c:x.chance_of_rain,i,t:x.time}});
  const ra=$('rain'),dp='<svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z" fill="#7cc4ff"/></svg>';
  if(pk&&pk.c>=30){ra.innerHTML=dp+(pk.i===0?`Şu an %${pk.c} yağış ihtimali var`:`${String(pk.t).slice(11,16)} saatinde %${pk.c} yağış bekleniyor`);ra.hidden=false}else ra.hidden=true;
  const sl=$('hours').scrollLeft;
  $('hours').innerHTML=hrs.length?hrs.map((h,i)=>{
    const hr=+(String(h.time).match(/\s(\d+)/)||[0,12])[1],dy=h.is_day!==undefined?h.is_day===1:(hr>=6&&hr<20);
    return `<div class="h ${i?(hr===0?'dayb':''):'now'}"><b>${i?(hr===0?dn(h.time):String(hr).padStart(2,'0')):'Şimdi'}</b>${ic(kindOf(h.condition&&h.condition.code),dy)}<span>${Math.round(h.temp_c)}°</span><small>${h.chance_of_rain>=20?'%'+h.chance_of_rain:''}</small></div>`}).join('')
    :'<p class="nodata">Saatlik veri henüz hazır değil, birazdan yenilenir.</p>';
  $('hours').scrollLeft=sl;

  DD=d;drawDays();
  // kutucuklar
  const ast=f[0].astro||{},aq=c.air_quality&&c.air_quality['us-epa-index'];
  const p=num(c.pressure_mb),v=num(c.vis_km),uv=num(c.uv)||0;
  const T=(h,body,sub)=>`<div class="t glass press" data-m="${MK[h]||''}"><button class="xc" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button><h4>${h}</h4>${body}<p>${sub||''}</p><div class="chart"></div></div>`;
  const S=(val,u)=>`<strong>${val}<em>${u||''}</em></strong>`;
  $('tiles').innerHTML=
   T('Hissedilen',S(Math.round(c.feelslike_c)+'°'),c.feelslike_c>c.temp_c+1?'Olduğundan sıcak hissediliyor':c.feelslike_c<c.temp_c-1?'Olduğundan soğuk hissediliyor':'Gerçek sıcaklığa yakın')+
   T('Nem',S(c.humidity,'%'),`Çiy noktası ${Math.round(c.dewpoint_c)}°`)+
   T('Rüzgar',`<div class="row">${S(Math.round(c.wind_kph),'km/s')}<div class="cmp"><svg id="wa" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg></div></div>`,`${c.wind_dir||'—'}${c.gust_kph?`, hamle ${Math.round(c.gust_kph)} km/s`:''}`)+
   T('UV indeksi',S(Math.round(uv))+`<div class="sc"><u style="left:${Math.min(uv/11,1)*100}%"></u></div>`,uvT(uv))+
   T('Görüş',S(v!==null?v:'—','km'),v>=10?'Açık':v>=4?'Orta':v!==null?'Kısıtlı':'')+
   T('Basınç',S(p>0?Math.round(p):'—','hPa'),p>0?(p<1009?'Düşük':p>1022?'Yüksek':'Normal'):'Veri yok')+
   T('Bulutluluk',S(num(c.cloud)??'—','%'),num(c.cloud)===null?'Veri yok':c.cloud<20?'Açık':c.cloud<60?'Parçalı bulutlu':c.cloud<90?'Çok bulutlu':'Kapalı')+
   T('Hava kalitesi',S(aq||'—')+(aq?`<div class="sc"><u style="left:${(aq-.5)/6*100}%"></u></div>`:''),aq?aqT(aq):'Veri yok')+skyTile(f,l.localtime);
  if(xm)openX(xm,true);
  requestAnimationFrame(()=>{const w=$('wa');if(w)w.style.transform=`rotate(${(c.wind_degree||0)+180}deg)`});
  if(firstRender){firstRender=false;document.body.classList.add('go')}
}
function start(){clearInterval(timer);load();syncOthers();timer=setInterval(()=>{if(!document.hidden)load()},300000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loc){if(cities.some(c=>c.geo))locate(true);if(age(ci)>60000)load();syncOthers()}});
addEventListener('pageshow',e=>{if(e.persisted&&loc&&age(ci)>60000)load()});
addEventListener('online',()=>load());
$('rf').onclick=()=>load();

let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').hidden=false});
$('inst').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$('inst').hidden=true};
addEventListener('appinstalled',()=>{$('inst').hidden=true;dip=null});

/* ---------- Konum ---------- */
const saveC=()=>LS.set('w_cities',JSON.stringify(cities));
const TT=['Birincil','İkincil','Üçüncül'];let sSlot=0;
function openSetup(c,slot){
  sSlot=slot||0;const has=!!cities[sSlot];
  $('setup').classList.add('on');
  $('closeBtn').style.display=(cities.length||sSlot>0)?'block':'none';
  $('delBtn').style.display=sSlot>0&&has?'block':'none';
  $('sTitle').textContent=(!has&&sSlot===0)?'Hoş geldin':`${TT[sSlot]} şehri ${has?'değiştir':'seçin'}`;
  $('sSub').textContent=sSlot?'Bu şehir de uygulamayı açtığında otomatik güncellenir.':'Bulunduğun yerin havasını takip et.';
  $('geoBtn').style.display=$('sOr').style.display=sSlot?'none':'';
  $('msg').textContent='';
}
function closeSetup(){$('setup').classList.remove('on');$('sg').innerHTML='';$('q').value=''}
function dots(){$('dots').innerHTML=[0,1,2].map(i=>`<i data-i="${i}" class="${i===ci?'on':''}${cities[i]?'':' em'}"></i>`).join('')}
function slideAnim(dir){
  if(!dir||reduce)return;
  [...$('app').children].filter(e=>!e.classList.contains('top')&&e.id!=='dots').forEach((e,i)=>e.animate([{opacity:0,transform:`translateX(${dir>0?40:-40}px)`},{opacity:1,transform:'none'}],{duration:450,delay:i*45,easing:'cubic-bezier(.2,1,.3,1)',fill:'backwards'}));
}
function showCity(i,dir){
  ci=i;loc=cities[i];lastJson='';lastTemp=null;closeX(true);
  exp=false;$('more').classList.remove('open');clearTimeout(xt);
  let ok=false;const c=LS.get('w_cache'+i);
  if(c){try{render(JSON.parse(c),true);ok=true}catch(e){}}
  document.body.classList.toggle('ld',!ok);
  if(!ok)$('cityName').textContent=loc.name||'';
  fetching=false;start();dots();slideAnim(dir);
}
function goCity(i,dir){if(i<0||i>2)return;if(!cities[i]){openSetup(false,i);return}showCity(i,dir)}
function swipe(dx){if(dx<0)goCity(ci+1,1);else goCity(ci-1,-1)}
function pick(l){
  const s=sSlot;cities[s]=l;saveC();LS.set('w_cache'+s,'');LS.set('w_t'+s,'0');closeSetup();
  showCity(s,s>ci?1:s<ci?-1:0);
}
function locate(silent){
  if(!navigator.geolocation){if(!silent)$('msg').textContent='Tarayıcı konumu desteklemiyor, şehir ara.';return}
  navigator.geolocation.getCurrentPosition(async p=>{
    const la=p.coords.latitude.toFixed(3),lo=p.coords.longitude.toFixed(3),q=la+','+lo;
    if(silent){
      const gi=cities.findIndex(c=>c.geo);if(gi<0)return;
      const name=await nameOf(la,lo)||(cities[gi].q===q&&cities[gi].name)||cities[gi].name||null;
      cities[gi]={q,geo:true,name};saveC();
      if(gi===ci){loc=cities[gi];load()}
        }else{pick({q,geo:true,name:await nameOf(la,lo)})}
  },()=>{if(!silent)$('msg').textContent='Konum izni verilmedi. Şehir adı yazarak devam et.'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}
$('geoBtn').onclick=()=>{$('msg').textContent='Konum alınıyor...';locate(false)};
$('cityBtn').onclick=()=>openSetup(true,ci);
$('delBtn').onclick=()=>{if(sSlot<1||!cities[sSlot])return;const s=sSlot;cities.splice(s,1);saveC();for(let i=s;i<3;i++){LS.set('w_cache'+i,'');LS.set('w_t'+i,'0')}closeSetup();showCity(s-1,-1)};
$('dots').onclick=e=>{const i=+(e.target.dataset||{}).i;if(isNaN(i)||i===ci||i>cities.length)return;goCity(i,i>ci?1:-1)};
{const hero=document.querySelector('.hero');let sx=0,sy=0,on=false;hero.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;on=true});hero.addEventListener('pointerup',e=>{if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6)swipe(dx)});hero.addEventListener('pointercancel',()=>{on=false})}
$('closeBtn').onclick=closeSetup;
let st;
$('q').addEventListener('input',e=>{
  clearTimeout(st);const v=e.target.value.trim();if(v.length<2){$('sg').innerHTML='';return}
  st=setTimeout(async()=>{
    try{
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(v)+'&count=8&language=tr&format=json');if(!r.ok)throw 0;const j=await r.json();const a=(j.results||[]).map(x=>({name:x.name,region:x.admin1||'',country:x.country||'',lat:x.latitude,lon:x.longitude}));
      $('sg').innerHTML=a.length?a.map((x,i)=>`<button data-i="${i}">${esc(x.name)}<small>${esc([x.region,x.country].filter(Boolean).join(', '))}</small></button>`).join(''):'<div class="msg">Sonuç bulunamadı</div>';
      $('sg').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=a[b.dataset.i];pick({q:(+x.lat).toFixed(2)+','+(+x.lon).toFixed(2),name:x.name})});
      $('msg').textContent='';
    }catch(err){$('msg').textContent='Arama başarısız. Bağlantıyı kontrol et.'}
  },300);
});

try{localStorage.removeItem('w_push')}catch(e){}
if(loc){const c=LS.get('w_cache0')||LS.get('w_cache');if(c){try{render(JSON.parse(c),true)}catch(e){}}saveC();dots();start();if(cities.some(c=>c.geo))locate(true)}else{dots();openSetup(false,0)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
